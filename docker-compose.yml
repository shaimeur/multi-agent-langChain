# Defaults to the offline configuration: CACHE_MODE=replay, no API keys needed.
# `docker compose up` on a fresh clone reproduces the demo from the committed
# fixtures alone.
#
# Four services, not the eight of cahier 12.3 — see docs/descope-v1.md §5. The
# build machine has ~5 GB of RAM to give, and the acceptance test for C9 is that
# this comes up on a clean machine, which is usually the examiner's laptop.
#   postgres -> dropped, SQLite checkpointer   (descope §1)
#   web      -> dropped, UI served from `api`  (descope §2, pending)
#   redis    -> dropped, in-process rate limit (cahier's own cut list, item 1)
#   indexer  -> folded into `api` as a background task, reachable as `forge index`

x-common: &common
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    CACHE_MODE: ${CACHE_MODE:-replay}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    QDRANT_URL: http://qdrant:6333
  volumes:
    # Embedding weights are downloaded once and shared, not baked per image.
    - hf-cache:/opt/hf
    # LangGraph checkpoints and session workspaces persist across restarts.
    - ./data:/app/data

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image ships no curl, so probe the port directly.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *common
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "forge.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      qdrant:
        condition: service_healthy

  # Offline insurance, off by default: `docker compose --profile offline up`.
  # Scoped to the grounded-Q&A path — a local 7B does not drive the repair loop,
  # and it cannot share 5 GB of RAM with Qdrant and the embedding model anyway.
  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # `sandbox` lands D7. It is not a long-running service: the executor spawns
  # ephemeral hardened containers through the Docker SDK
  # (--network=none, read-only root, non-root user, memory/CPU/PID caps).
  # What compose contributes is building the image the executor spawns.

volumes:
  hf-cache:
  qdrant-storage:
  ollama-models:
