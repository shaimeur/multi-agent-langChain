[project]
name = "forge"
version = "0.1.0"
description = "Multi-agent engineering assistant: grounded code RAG, planned patches, sandbox-verified tests."
readme = "README.md"
# Pinned to 3.12: the ML stack (torch / sentence-transformers) still lags on 3.13+.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- orchestration ---
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    # --- LLM providers (swappable via LLM_PROVIDER in .env) ---
    "langchain-google-genai>=2.1",
    "langchain-groq>=0.3",
    "langchain-ollama>=0.3",
    # --- retrieval ---
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    # Declared explicitly, though sentence-transformers already pulls it, so the
    # CPU index pin below actually binds — tool.uv.sources only applies to direct
    # dependencies, not transitive ones.
    "torch>=2.6",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    # --- AST-aware chunking (cahier 6.2) ---
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    # --- sandbox executor (cahier 8.3) ---
    "docker>=7.1",
    # --- services ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    # --- CLI (cahier 10.2) ---
    "typer>=0.15",
    "rich>=13.9",
    # --- plumbing ---
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The `ui` extra held streamlit while descope §2 (Streamlit vs React) was open.
# O1 resolved on 2026-07-24 in favour of the cahier's original — React + Vite + TS —
# so the extra is dropped as that comment said it would be, and the UI lives in
# `web/` as its own build rather than as a Python dependency of this package.
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyter-core>=5.9.1",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "pandas>=3.0.3",
]

[project.scripts]
forge = "forge.cli.main:app"

# sentence-transformers pulls torch, and torch's default Linux wheel bundles the
# whole CUDA runtime — 2.7 GB of NVIDIA libraries plus a 1.1 GB torch. This
# machine has no NVIDIA driver (Intel UHD only) and neither does the examiner's
# laptop, so none of it can ever execute. Pinning the CPU index took the image
# from 11.1 GB to something a clean-machine `docker compose up` can survive,
# which is acceptance criterion C9.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# `forge` is installed, but `evals/` is not packaged — it is harness code, not
# shipped. The project root on the path is what lets tests/test_swe_mini.py import
# the D8 benchmark without a src-layout hack or a sys.path insert in a conftest.
pythonpath = ["."]
# Tests never reach the network — tests/conftest.py forces CACHE_MODE=replay.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `evals` is first-party too — it just is not packaged (harness code, not shipped).
# Without this, isort files it under third-party and fights the import order.
known-first-party = ["forge", "evals"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented idiom is a call in the parameter default; these are
# declarations, not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
